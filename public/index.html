<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MC Tools</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="/"><img class="brand__logo" src="/img/logo.svg" alt="" /><span class="app-name">MC Tools</span></a>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 class="app-name">MC Tools</h1>
      <p id="tagline"></p>
    </section>

    <div class="toolbar">
      <label class="search">
        <input class="input" type="search" id="search" placeholder="Rechercher un outil…" aria-label="Rechercher un outil" autocomplete="off" />
      </label>
      <div class="chips" id="categoryFilter" role="group" aria-label="Filtrer par catégorie"></div>
    </div>

    <div id="toolList"></div>
    <p class="empty" id="emptyState" hidden></p>
  </main>

  <footer class="footer">Accès réservé · <span class="app-name">MC Tools</span></footer>

  <script src="/js/portal.js"></script>
</body>
</html>
