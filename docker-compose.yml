# =============================================================================
#  Déploiement sur le VPS (Traefik + HTTPS automatique)
#  Mot de passe partagé : BASIC_AUTH_USERS dans .env (jamais commité), généré par
#    htpasswd -nbB client 'mot de passe'
#  et écrit entre apostrophes dans .env :  BASIC_AUTH_USERS='client:$2y$05$…'
#  Pas de `ports:` : Traefik route le trafic via le réseau `proxy`.
# =============================================================================
name: mctools

services:
  web:
    build: .
    image: mctools:local
    restart: unless-stopped
    volumes:
      - data:/data
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.mctools.rule: Host(`${SITE_HOST:-mctools.paulpenot.fr}`)
      traefik.http.routers.mctools.middlewares: mctools-auth,compress@file
      traefik.http.middlewares.mctools-auth.basicauth.users: ${BASIC_AUTH_USERS:?BASIC_AUTH_USERS manquant dans .env}
      traefik.http.middlewares.mctools-auth.basicauth.realm: "MC Tools"
      traefik.http.services.mctools.loadbalancer.server.port: "3000"
      mc.name: "MC Tools"
      mc.description: "Multi-tool client : documents, images, foncier, finances"
      mc.icon: "🧰"

networks:
  proxy:
    external: true

volumes:
  data:
